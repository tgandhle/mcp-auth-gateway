name: approval-evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: true

      - name: Set up and install locked environment
        run: |
          uv python install 3.12
          uv sync --frozen --extra dev

      - name: Collect technical evidence
        shell: pwsh
        run: ./verification/collect_evidence.ps1 -OutputPath approval-evidence.md

      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: approval-evidence-${{ github.sha }}
          path: approval-evidence.md
          if-no-files-found: error
